services:
  keycloak:
    container_name: "keycloak"
    restart: unless-stopped
    env_file:
      - .env
    image: charizark2710/sunflower-keycloak
    # command: bash -c "while :; do echo 'Hit CTRL+C'; sleep 1; done"
    command: [ "start-dev", "--import-realm", "--verbose", "--hostname-strict=false", "--hostname=${KEYCLOAK_AUTHEN_URL}" ]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/keycloak
      - KC_DB_URL_HOST=${POSTGRES_HOST}
      - KC_DB_URL_PORT=${POSTGRES_PORT}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME_URL=${KEYCLOAK_AUTHEN_URL}
      - KC_HOSTNAME_ADMIN_URL=${KEYCLOAK_AUTHEN_URL}
    # ports:
    #   - '9000:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 1 : 0); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/health/live'
        ]
      retries: 5
      start_period: 20s
    networks:
      pi4:
        aliases:
          - auth.sunflower-rdips
    deploy:
      placement:
        constraints:
          - node.role == worker
    # volumes:
    #   - keycloak:/opt

  rabbitmq:
    container_name: "rabbitmq"
    restart: unless-stopped
    # command: tail -F /dev/null
    image: charizark2710/sunflower-rabbitmq
    environment:
      - RABBITMQ_ERLANG_COOKIE=/var/lib/rabbitmq/.erlang.cookie
      - RABBITMQ_CONFIG_FILES=/etc/rabbitmq/rabbitmq.conf
      - RABBITMQ_MNESIA_BASE=/data/mnesia
      - RABBITMQ_LOG_BASE=/data/log
      - RABBITMQ_ENABLED_PLUGINS_FILE=/etc/rabbitmq/enabled_plugins
    ports:
      - '5672:5672'
      - '15672:15672'
      - '1883:1883'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      timeout: 30s
      retries: 3
    networks:
      pi4:
        aliases:
          - amqp-management.sunflower-rdips
          - mqtt.sunflower-rdips
          - amqp.sunflower-rdips
    deploy:
      placement:
        constraints:
          - node.role == worker
  # gateway:
  #   container_name: "gateway"
  #   # Maybe there some memory leak that prevent docker to excute command so this is good for now
  #   # entrypoint: ["./bin/RDIPs-Gateway"]
  #   entrypoint: ["tail", "-f", "/dev/null"]
  #   build:
  #     context: ./RDIPs-Gateway
  #     dockerfile: Gateway.Dockerfile
  #   env_file:
  #     - .env
  #   ports:
  #     - '8080:8080'
  #   volumes:
  #     - './RDIPs-Gateway:/var/lib/gateway'
  #   # command: ["/bin/sh", "-c", "tail -F /dev/null"]
  #   networks:
  #     pi4:
  #       aliases:
  #         - sfBroker
  db:
    container_name: postgres
    env_file:
      - .env
    image: charizark2710/sunflower-db
    build: 
      context: ./RDIPs-Database
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"
        ]
      timeout: 60s
      retries: 5
      start_period: 80s
    depends_on:
      - migration
    # volumes:
    #   - db:/var/lib/postgresql/data
    networks:
      pi4:
        aliases:
          - sunflower-rdips
    deploy:
      placement:
        constraints:
          - node.role == worker

  mongo:
    image: mongo:8.0.0-rc15
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD","mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      pi4:
        aliases:
          - sunflower-mongo
    deploy:
      placement:
        constraints:
          - node.role == worker

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9090:80"
    # volumes:
    #   - pgadmin:/var/lib/pgadmin
    networks:
      pi4:
        aliases:
          - sunflower

  memcached:
    image: 'bitnami/memcached:latest'
    restart: unless-stopped
    ports:
      - '11211:11211'
    networks:
      pi4:
        aliases:
          - cacheSrv
    healthcheck:
      test: "/bin/nc -z 127.0.0.1 11211"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  api:
    container_name: sunflower_api
    env_file:
      - .env
    image: charizark2710/sunflower-api
    healthcheck:
      test: curl -f localhost:${API_PORT}
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - '8080:8080'
    # volumes:
    #   - './RDIPs-BE:/srv/www/volume_sunflower'
    networks:
      pi4:
        aliases:
          - sunflower-rdips
    deploy:
      placement:
        constraints:
          - node.role == worker

  api_bk:
    container_name: sunflower_api_bk
    restart: on-failure:3
    env_file:
      - .env
    image: charizark2710/sunflower-api
    ports:
      - '8081:8080'
    # volumes:
    #   - './RDIPs-BE:/srv/www/volume_sunflower'
    networks:
      pi4:
        aliases:
          - sunflower-rdips
    deploy:
      placement:
        constraints:
          - node.role == manager

  server:
    container_name: sunflower_server
    restart: unless-stopped
    image: charizark2710/sunflower-server
    ports:
      - "80:80"
      - "81:81"
      - "9000:9000"
      - "443:443"
      - "8883:8883"
      - "8672:8672"
    env_file:
      - .env
    # volumes:
    #   - './RDIPs-Server/conf.d:/opt/nginx/conf.d'
    #   - './RDIPs-Server/nginx.conf:/opt/nginx/conf'
    #   - './RDIPs-Server/stream.conf.d:/opt/nginx/stream.conf.d'
    deploy:
      placement:
        constraints:
          - node.role == worker
    networks:
      pi4:

# volumes:
#   db:
#   pgadmin:
#   api:
#   keycloak:
networks:
  pi4:
    driver: overlay
