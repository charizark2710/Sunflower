services:
  migration:
    container_name: migration
    env_file:
      - .env
    image: charizark2710/sunflower-migration
    build: 
      context: ./RDIPs-Migration

  mongo:
    image: mongo:8.0.0-rc15
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD","mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      pi4:
        aliases:
          - sunflower-mongo

  db:
    container_name: postgres
    env_file:
      - .env
    image: charizark2710/sunflower-db
    build: 
      context: ./RDIPs-Database
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"
        ]
      timeout: 60s
      retries: 5
      start_period: 80s
    # entrypoint: /usr/local/bin/entrypoint.sh
    depends_on:
      - migration
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      pi4:
        aliases:
          - sunflower-rdips

  keycloak:
    container_name: "keycloak"
    restart: unless-stopped
    env_file:
      - .env
    build:
      context: ./RDIPs-Server
      dockerfile: keycloak.Dockerfile
    image: charizark2710/sunflower-keycloak
    # command: bash -c "while :; do echo 'Hit CTRL+C'; sleep 1; done"
    command: [ "start", "--import-realm", "--verbose", "--hostname-strict=false", "--hostname=${KEYCLOAK_AUTHEN_URL}", "--https-certificate-file=/opt/keycloak/certs/rootCA.crt", "--https-certificate-key-file=/opt/keycloak/certs/rootCA.key" ]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/keycloak
      - KC_DB_URL_HOST=${POSTGRES_HOST}
      - KC_DB_URL_PORT=${POSTGRES_PORT}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME_URL=${KEYCLOAK_AUTHEN_URL}
      - KC_HOSTNAME_ADMIN_URL=${KEYCLOAK_AUTHEN_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8443:8443'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --head -fsS https://localhost:8443 --insecure'
        ]
      retries: 5
      start_period: 20s
    networks:
      pi4:
        aliases:
          - auth.sunflower-rdips
    volumes:
      - keycloak:/opt
      - ./certs:/opt/keycloak/certs/

  rabbitmq:
    container_name: "rabbitmq"
    restart: unless-stopped
    # command: tail -F /dev/null
    build:
      context: ./RDIPs-Gateway
      dockerfile: Broker.Dockerfile
      args:
        - BROKER_USER=${BROKER_USER}
        - BROKER_PASSWORD=${BROKER_PASSWORD}
    image: charizark2710/sunflower-rabbitmq
    env_file:
      - .env
    environment:
      - RABBITMQ_ERLANG_COOKIE=/var/lib/rabbitmq/.erlang.cookie
      - RABBITMQ_CONFIG_FILES=/etc/rabbitmq/${BROKER_PROTOCOL}/rabbitmq.conf
      - RABBITMQ_MNESIA_BASE=/data/mnesia
      - RABBITMQ_LOG_BASE=/data/log
      - RABBITMQ_ENABLED_PLUGINS_FILE=/etc/rabbitmq/enabled_plugins
      - RABBITMQ_DEFAULT_USER=${BROKER_USER}
      - RABBITMQ_DEFAULT_PASS=${BROKER_PASSWORD}
    ports:
      - '5671:5671'
      - '15671:15671'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      timeout: 30s
      retries: 3
    depends_on:
      - migration
    networks:
      pi4:
        aliases:
          - amqp-management.sunflower-rdips
          - mqtt.sunflower-rdips
          - amqp.sunflower-rdips
    volumes:
      - ./certs:/opt/rabbitmq/certs/
  # gateway:
  #   container_name: "gateway"
  #   # Maybe there some memory leak that prevent docker to excute command so this is good for now
  #   # entrypoint: ["./bin/RDIPs-Gateway"]
  #   entrypoint: ["tail", "-f", "/dev/null"]
  #   build:
  #     context: ./RDIPs-Gateway
  #     dockerfile: Gateway.Dockerfile
  #   env_file:
  #     - .env
  #   ports:
  #     - '8080:8080'
  #   depends_on:
  #     - rabbitmq
  #   volumes:
  #     - './RDIPs-Gateway:/var/lib/gateway'
  #   # command: ["/bin/sh", "-c", "tail -F /dev/null"]
  #   networks:
  #     pi4:
  #       aliases:
  #         - sfBroker

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9090:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      pi4:
        aliases:
          - sunflower

  memcached:
    image: 'bitnami/memcached:1.6.29-debian-12-r4'
    restart: unless-stopped
    ports:
      - '11211:11211'
    networks:
      pi4:
        aliases:
          - cacheSrv
    healthcheck:
      test: "/bin/nc -z 127.0.0.1 11211"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  api:
    container_name: sunflower_api
    env_file:
      - .env
    build:
      context: ./RDIPs-BE
      dockerfile: Dockerfile
      target: production
    image: charizark2710/sunflower-api
    healthcheck:
      test: curl -f localhost:${API_PORT}
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      - CONSUMER_PRIORITY=10
    ports:
      - '8080:8080'
    volumes:
      - 'api:/srv/www/volume_sunflower'
      - ./certs/:/sunflower/certs/
    networks:
      pi4:
        aliases:
          - sunflower-rdips

  api_bk:
    container_name: sunflower_api_bk
    restart: on-failure:3
    env_file:
      - .env
    build:
      context: ./RDIPs-BE
      dockerfile: Dockerfile
      target: production
    image: charizark2710/sunflower-api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8081:8080'
    volumes:
      - 'api:/srv/www/volume_sunflower'
      - ./certs/:/sunflower/certs/
    networks:
      pi4:
        aliases:
          - sunflower-rdips

  ui:
    container_name: sunflower_ui
    env_file:
      - .env
    build:
      context: ./RDIPs-FE
      dockerfile: Dockerfile
    # command: [ "serve", "-s", "build" ]
    image: charizark2710/sunflower-ui
    depends_on: [ api ]
    ports:
      - '3000:3000'
    networks:
      pi4:
        aliases:
          - sunflower-rdips

  server:
    container_name: sunflower_server
    restart: unless-stopped
    build:
      context: ./RDIPs-Server
    env_file:
      - .env
    image: charizark2710/sunflower-server
    depends_on: [ api, ui, api_bk ]
    ports:
      - "80:80"
      - "81:81"
      - "9000:9000"
      - "443:443"
      - "8883:8883"
      - "8672:8672"
    volumes:
      - './RDIPs-Server/conf.d:/opt/nginx/conf.d'
      - './RDIPs-Server/nginx.conf:/opt/nginx/conf'
      - './RDIPs-Server/stream.conf.d:/opt/nginx/stream.conf.d'
    networks:
      pi4:
    secrets:
      - source: rootCA_key
        target: /etc/nginx/rootCA.key
      - source: rootCA_cert
        target: /etc/nginx/rootCA.crt
      - source: client_cert
        target: /etc/nginx/client.crt
      - source: client_key
        target: /etc/nginx/client.key
      - source: dhparam_pem
        target: /etc/nginx/dhparam.pem

volumes:
  db:
  pgadmin:
  api:
  keycloak:
networks:
  pi4:
    driver: bridge

secrets:
  rootCA_key:
    file: ./certs/rootCA.key
  rootCA_cert:
    file: ./certs/rootCA.crt
  dhparam_pem:
      file: ./certs/dhparam.pem
  client_key:
    file: ./certs/client.key
  client_cert:
    file: ./certs/client.crt
