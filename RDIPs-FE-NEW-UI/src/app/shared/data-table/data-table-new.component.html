<div class="data-table-container">
  <table class="data-table">
    <thead>
      <tr>
        <th *ngFor="let column of columns" class="data-table-header">
          {{ column.label }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let element of dataSource; let i = index" class="data-table-row">
        
        <td *ngFor="let column of columns" class="data-table-cell">
          
          <!-- Device Info Display -->
          <div *ngIf="column.type === 'device-info'" class="device-info">
            <div class="device-icon" [ngClass]="getStatusClass(element.status)">
              <i class="fas fa-desktop"></i>
            </div>
            <div class="device-details">
              <div class="device-name">{{ element.name }}</div>
              <div class="device-id">{{ element.email || element.username || element.id }}</div>
            </div>
          </div>
          
          <!-- Progress Bar Display -->
          <div *ngIf="column.type === 'progress'" class="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" 
                   [ngClass]="getProgressClass(element.progress)"
                   [style.width.%]="element.progress || 60">
              </div>
            </div>
            <span class="progress-text">{{ element.progress || 60 }}%</span>
          </div>
          
          <!-- Status Badge Display -->
          <div *ngIf="column.type === 'status'" class="status-badge" [ngClass]="getStatusClass(element.status)">
            <div class="status-dot"></div>
            {{ getStatusText(element.status) }}
          </div>
          
          <!-- Action Buttons Display -->
          <div *ngIf="column.type === 'actions'" class="action-buttons">
            <button class="action-btn" title="Delete" (click)="onDelete(element)">
              <img src="assets/icons/trash.svg" alt="Delete" width="16" height="16">
            </button>
            <button class="action-btn" title="Edit" (click)="onEdit(element)">
              <img src="assets/icons/edit.svg" alt="Edit" width="16" height="16">
            </button>
          </div>
          
          <!-- Regular Text Display -->
          <span *ngIf="column.type === 'text' || !column.type">
            {{ element[column.key] }}
          </span>
          
        </td>
        
      </tr>
    </tbody>
  </table>
</div>
