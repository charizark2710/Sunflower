<div class="box">
    <div class="box-left">
        <div class="card-image"></div>
    </div>
    <div class="box-right">
        <div class="title">
            {{ card.title | translate }}
        </div>
        <div class="data">
            <div class="data-value">
                {{ card.number }}
            </div>
            <div class="data-unit">
                {{ card.rate }}
            </div>
        </div>
    </div>
</div>
